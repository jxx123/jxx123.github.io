<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}">
  <link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/favicons/apple-touch-icon.png' | relative_url }}">
  {% seo %}
  <style>
    :root {
      --text-primary: #1a1a1a;
      --text-secondary: #555;
      --text-muted: #888;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #ffffff;
      --bg-subtle: #f8f9fa;
      --border: #e5e7eb;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: var(--text-primary);
      background: var(--bg);
      line-height: 1.75;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Links --- */
    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    /* --- Container --- */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* --- Header / Hero --- */
    .header {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      margin-bottom: 28px;
    }

    .profile-photo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 3px solid var(--border);
    }

    .header-info { flex: 1; }

    .header-info h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .header-info .subtitle {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      font-size: 0.92rem;
      list-style: none;
    }

    .contact-links a {
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .contact-links a:hover { color: var(--accent); text-decoration: none; }
    .contact-links svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* --- Content typography --- */
    .content h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 40px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      letter-spacing: -0.01em;
    }

    .content h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 6px;
    }

    .content p {
      margin-bottom: 14px;
      line-height: 1.8;
    }

    .content ul, .content ol {
      margin-bottom: 14px;
      padding-left: 1.4em;
    }

    .content li {
      margin-bottom: 10px;
      line-height: 1.7;
    }

    .content li p { margin-bottom: 6px; }

    .content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 36px 0;
    }

    .content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 12px 0;
      border: 1px solid var(--border);
    }

    .content code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.88em;
      background: var(--bg-subtle);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .content blockquote {
      border-left: 3px solid var(--accent);
      margin: 16px 0;
      padding: 8px 16px;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border-radius: 0 6px 6px 0;
    }

    /* --- Video embed --- */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      margin: 10px 0;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
      border-radius: 8px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 12px 0;
    }

    .video-grid .video-wrapper:last-child:nth-child(odd) {
      grid-column: 1 / -1;
      max-width: 50%;
    }

    /* --- Tool cards --- */
    .tool-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .tool-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(37, 99, 235, 0.08);
    }
    .tool-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
      padding-top: 2px;
    }
    .tool-info { flex: 1; }
    .tool-name { font-weight: 600; font-size: 0.98rem; margin-bottom: 2px; }
    .tool-name a { color: var(--text-primary); }
    .tool-name a:hover { color: var(--accent); text-decoration: none; }
    .tool-desc { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.5; }
    .tool-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 1px 8px;
      border-radius: 12px;
      background: var(--bg-subtle);
      color: var(--text-muted);
      margin-top: 6px;
      border: 1px solid var(--border);
    }

    /* --- Footer --- */
    .footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
      .container { padding: 36px 18px 60px; }
      .header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
      }
      .contact-links { justify-content: center; }
      .header-info h1 { font-size: 1.6rem; }
      .profile-photo { width: 110px; height: 110px; }
      .video-grid { grid-template-columns: 1fr; }
      .video-grid .video-wrapper:last-child:nth-child(odd) { max-width: 100%; }
    }
  </style>
</head>
